name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build bundles & sync example
        run: npm run build

      - name: Check for uncommitted build drift in example/
        run: |
          git diff --exit-code example/ || (echo "::error::example/ files are out of sync with src/. Run 'npm run build' and commit the updated example/ files." && exit 1)

      - name: Run tests
        run: npm test