name: CI

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-build:
    name: Unit Tests & Build Drift (Node 26)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundles
        run: npm run build:prod

      - name: Run unit tests
        run: npm test

      - name: Verify zero build drift in tracked example assets
        run: npm run check:drift

  e2e:
    name: Playwright E2E Tests (Node 26)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build production bundles for example server
        run: npm run build:prod

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
